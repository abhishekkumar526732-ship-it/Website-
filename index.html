
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            border: 1px solid #ddd;
            padding: 35px 30px;
            width: 280px;
            text-align: center;
        }

        h1 {
            font-family: cursive;
            font-size: 38px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-bottom: 10px;
            background: #fafafa;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        p {
            font-size: 14px;
            color: #555;
            margin-top: 25px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h1>Instagram</h1>

        <form onsubmit="event.preventDefault(); alert('Demo login page!');">
            <input type="text"
                   placeholder="Phone number, username or email"
                   required>

            <input type="password"
                   placeholder="Password"
                   required>

            <button type="submit">Log in</button>
        </form>

        <p>Forgot password?</p>
        <p>Don't have an account? Sign up</p>
    </div>

</body>
</html>
